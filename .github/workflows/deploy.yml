name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One deploy at a time. Two overlapping runs would race on `docker compose up`
# and leave the VM running whichever finished second, which is not necessarily
# the newer one.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The VM is Oracle ARM64, and the runner is x86. QEMU is what bridges
      # the two.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          # Tagging the sha alongside latest is what makes rollback possible:
          # edit the compose file with the previous sha and `up -d`.
          tags: |
            ghcr.io/alejandrogmota/scrumboard-api:latest
            ghcr.io/alejandrogmota/scrumboard-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy the compose file to the VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "deploy/docker-compose.yml"
          target: "~/scrumboard-api/"
          strip_components: 1

      - name: Pull and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/scrumboard-api
            # This repository is public, so its GHCR image is public too and
            # the VM pulls it without logging in. scrumboard-web is private
            # and does need the login step — the asymmetry is deliberate, and
            # is why one deploy works and the other would return 403.
            docker compose pull
            docker compose --env-file .env up -d --remove-orphans
            docker image prune -f

      - name: Verify the container came up with its volume attached
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -euo pipefail
            # Give it a moment to migrate and bind.
            for i in $(seq 1 20); do
              if curl -sf http://localhost:8020/health > /dev/null; then
                echo "healthy"
                exit 0
              fi
              sleep 2
            done
            echo "health check never passed; last 50 log lines:"
            cd ~/scrumboard-api && docker compose logs --tail 50
            exit 1
