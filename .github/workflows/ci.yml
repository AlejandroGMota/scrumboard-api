name: CI

# Every push and every pull request, not only main. CI that runs after the
# merge has stopped serving the one purpose it has (02-testing.md §8.2).
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs the history to scan it, not just the tip.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Test with the race detector
        run: go test -race -coverprofile=cover.out ./...

      - name: Build
        run: go build ./...

      # Golden files are part of the contract with the frontend. If they were
      # regenerated without being looked at, the diff shows up here.
      #
      # Scoped to the one package that has golden files, not `./...`. -update
      # is a flag internal/testutil/golden.go defines for its own test binary;
      # `go test ./... -update` passes it to every package's test binary, and
      # one that never imports testutil (internal/domain, for instance) has no
      # idea what -update is and fails immediately with "flag provided but not
      # defined". This is what a truncated CI log can look like: the failure
      # reads as a domain test failing, when domain never ran at all.
      - name: Golden files are committed and current
        run: |
          go test ./internal/adapter/in/http/... -update
          if ! git diff --quiet -- internal/adapter/in/http/testdata/golden; then
            echo "::error::Golden files differ from the committed ones."
            git diff -- internal/adapter/in/http/testdata/golden
            exit 1
          fi

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the last release before Atlas's v0.38 licensing change,
      # which moved `atlas migrate lint` behind a paid Pro plan (`atlas
      # login`) in Ariga's official binary. Building the OSS source instead
      # (`go install ariga.io/atlas/...@latest`) also avoids the paywall, but
      # atlas pulls in a large dependency tree — cloud SDKs for every driver it
      # supports — and a cold build took 4+ minutes locally, which is both
      # slow on every run and more surface for a flaky module-proxy fetch to
      # fail on. A prebuilt binary of a version that predates the paywall is
      # faster and just as free. Verified directly: v0.37.0 runs `migrate
      # lint` clean, no login prompt.
      #
      # This pin has a shelf life: Ariga's installer already warns that
      # v0.37.0 "will soon be deprecated and be unavailable for download."
      # When that happens this step starts failing on the download itself,
      # not on a paywall — a different, easier-to-diagnose failure. At that
      # point the fix is either a newer pre-Pro version if one exists, or
      # accepting the ~5 min go-install-from-source build as the cost of
      # keeping this check free.
      - uses: ariga/setup-atlas@v0
        with:
          version: v0.37.0

      # Catches a generated migration that would drop a column or rewrite a
      # table — which on SQLite means a full table rebuild (01-structure.md §1.8).
      - name: Lint the newest migration
        run: atlas migrate lint --env local --latest 1

      # Catches a schema.sql edited without regenerating the migration.
      # `atlas migrate diff` has no dry-run flag — it always writes a file —
      # so the check is `atlas schema diff` against the replayed migrations,
      # which is read-only. Delegated to `make` so the same logic that runs
      # here is what a developer runs locally, rather than a second copy that
      # can drift from it.
      - name: schema.sql and migrations/ agree
        run: make schema-check

  secrets:
    # This repository is public. A token committed here stays in the history
    # forever, and rotating it is the only remedy — three lines of workflow
    # against a mistake that is otherwise unrecoverable (00-scope.md §7).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
