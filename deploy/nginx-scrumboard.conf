# scrumboard.alejandrogmota.com
#
# This file describes the whole subdomain, including the paths that go to the
# web container. It lives in the API repository because that is where basic
# auth, /api and /ws are — the parts that actually change (01-structure.md §1.4).
#
# It is PUBLIC. It must never contain the VM's address, the token, or the
# htpasswd contents. Only paths and ${VARIABLES}.
#
# Install:
#   sudo cp nginx-scrumboard.conf /etc/nginx/sites-available/scrumboard
#   sudo ln -s /etc/nginx/sites-available/scrumboard /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d scrumboard.alejandrogmota.com
#
# certbot rewrites the listen block and adds the certificate lines and the
# port-80 redirect. Run it after the A record resolves, not before.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name scrumboard.alejandrogmota.com;

    # Small board, small payloads. This is a guard, not a tuning knob.
    client_max_body_size 2m;

    # --- the public half ----------------------------------------------------
    #
    # No auth_basic here, ever. A 401 to Googlebot means nothing is indexed,
    # and being found is the entire job of this half (01-structure.md §3).
    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- the board: auth layer 1 --------------------------------------------
    location /app {
        auth_basic           "ScrumBoard";
        auth_basic_user_file /etc/nginx/.htpasswd-scrumboard;

        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- the API: layer 1, plus the token checked by Go middleware ----------
    location /api/ {
        auth_basic           "ScrumBoard";
        auth_basic_user_file /etc/nginx/.htpasswd-scrumboard;

        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- the WebSocket ------------------------------------------------------
    location /ws {
        auth_basic           "ScrumBoard";
        auth_basic_user_file /etc/nginx/.htpasswd-scrumboard;

        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        # Without this nginx closes an idle WebSocket after 60 seconds, and
        # the client reconnects for ever wondering why (01-structure.md §3).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The health check is unauthenticated on purpose: the deploy pipeline
    # curls it, and a token in that curl would be a token in the workflow.
    # It is only reachable from the VM itself, over localhost.
    location = /health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8020;
    }
}
