# scrumboard.alejandrogmota.com
#
# This file describes the whole subdomain, including the paths that go to the
# web container. It lives in the API repository because that is where /api and
# /ws are — the parts that actually change (01-structure.md §1.4).
#
# It is PUBLIC. It must never contain the VM's address or the token. Only
# paths and ${VARIABLES}.
#
# Install:
#   sudo cp nginx-scrumboard.conf /etc/nginx/sites-available/scrumboard
#   sudo ln -s /etc/nginx/sites-available/scrumboard /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d scrumboard.alejandrogmota.com
#
# certbot rewrites the listen block and adds the certificate lines and the
# port-80 redirect. Run it after the A record resolves, not before.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate limiting for the API.
#
# This exists because basic auth was removed (see the note on /app below).
# Layer 1's real job was never secrecy — the token already provides that — it
# was refusing scanners cheaply, before they reached the Go process. A rate
# limit does the same job without putting a browser dialog in front of the
# user: a bot spraying tokens gets throttled at the edge, and a legitimate
# client never comes close to the limit.
#
# 10r/s with burst=20 is far above what one person's board generates: opening
# a board is a handful of requests, and a sync batch is one. The zone holds
# ~160k addresses in 10 MB.
limit_req_zone $binary_remote_addr zone=scrumboard_api:10m rate=10r/s;

server {
    listen 80;
    server_name scrumboard.alejandrogmota.com;

    # Small board, small payloads. This is a guard, not a tuning knob.
    client_max_body_size 2m;

    # Do not advertise the nginx version to anyone probing.
    server_tokens off;

    # --- the public half ----------------------------------------------------
    #
    # No auth here, ever. A 401 to Googlebot means nothing is indexed, and
    # being found is the entire job of this half (01-structure.md §3).
    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- the board ----------------------------------------------------------
    #
    # Deliberately NOT behind basic auth, and this is a decision with a cost
    # worth naming (00-scope.md §6.1 originally specified both layers).
    #
    # What is actually served here is the PWA shell: static HTML, JS and CSS.
    # It contains no board data. Everything that does — every card, column and
    # title — comes from /api, which requires the token on every request. So
    # what an unauthenticated visitor can now reach is a page that asks them
    # for a token, which is what every hosted application on the internet
    # serves at its front door.
    #
    # What was given up: basic auth turned away scanners before they reached
    # the app at all. The rate limit above replaces the cheap part of that.
    # What was gained: the sign-in is a real page the app controls, instead of
    # a native browser dialog that cannot be styled and looks broken inside an
    # installed PWA window with no address bar.
    location /app {
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- the API: the token, checked by Go middleware -----------------------
    location /api/ {
        limit_req zone=scrumboard_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- the WebSocket ------------------------------------------------------
    #
    # No rate limit: this is one long-lived connection per device, not a
    # request stream. The token is checked during the handshake.
    location /ws {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;

        # Without this nginx closes an idle WebSocket after 60 seconds, and
        # the client reconnects for ever wondering why (01-structure.md §3).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The health check is unauthenticated on purpose: the deploy pipeline
    # curls it, and a token in that curl would be a token in the workflow.
    # It is only reachable from the VM itself, over localhost.
    location = /health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8020;
    }
}
